<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MASP 模块化气动智能保鲜舱 · 产品陈列室</title>

  <style>
    :root {
      --bg: #0a0a0a;
      --panel: rgba(255, 255, 255, 0.05);
      --border: rgba(255, 255, 255, 0.10);
      --accent: #4cc2ff;          /* 冷光青 */
      --accent2: #7a5cff;         /* 冷光紫 */
      --text: #e8e8ea;
      --muted: #9aa0a8;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg);
      overflow: hidden;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      color: var(--text);
    }

    /* 全屏 3D 展示区 */
    model-viewer {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background:
        radial-gradient(1200px 620px at 50% 112%, rgba(76, 194, 255, 0.10), transparent 62%),
        radial-gradient(900px 480px at 50% -12%, rgba(122, 92, 255, 0.08), transparent 60%),
        var(--bg);
    }

    /* 左上角半透明标题栏 */
    .titlebar {
      position: fixed;
      top: 22px;
      left: 22px;
      z-index: 10;
      padding: 16px 22px 16px 26px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
      user-select: none;
      pointer-events: none;   /* 不拦截鼠标，保证拖拽模型流畅 */
    }
    .titlebar::before {
      content: "";
      position: absolute;
      left: 0;
      top: 14px;
      bottom: 14px;
      width: 3px;
      border-radius: 2px;
      background: linear-gradient(180deg, var(--accent), var(--accent2));
    }
    .title-main {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 2px;
    }
    .title-sub {
      margin-top: 7px;
      font-size: 12px;
      letter-spacing: 3px;
      color: var(--muted);
    }
    .title-en {
      margin-top: 4px;
      font-size: 10px;
      letter-spacing: 2px;
      color: rgba(154, 160, 168, 0.7);
    }

    /* 右下角操作提示 */
    .hint {
      position: fixed;
      right: 22px;
      bottom: 22px;
      z-index: 10;
      padding: 10px 16px;
      font-size: 12px;
      letter-spacing: 1px;
      color: var(--muted);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 999px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      user-select: none;
      pointer-events: none;
    }

    /* 左下角小标签 */
    .badge {
      position: fixed;
      left: 22px;
      bottom: 24px;
      z-index: 10;
      font-size: 11px;
      letter-spacing: 3px;
      color: rgba(154, 160, 168, 0.65);
      user-select: none;
      pointer-events: none;
    }
  </style>

  <!-- Google <model-viewer> Web 组件（最新版 4.4.0） -->
  <script type="module"
          src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.4.0/model-viewer.min.js"></script>
</head>
<body>

  <model-viewer
    id="pod-viewer"
    src="advanced_pod_assembly_final.glb"
    alt="MASP 模块化气动智能保鲜舱 3D 模型"
    camera-controls
    auto-rotate
    auto-rotate-delay="0"
    rotation-per-second="20deg"
    shadow-intensity="1"
    shadow-softness="0.85"
    exposure="1.2"
    environment-image="neutral"
    tone-mapping="aces"
    camera-orbit="32deg 72deg 125%"
    min-camera-orbit="auto 12deg auto"
    max-camera-orbit="auto 90deg auto"
    field-of-view="32deg"
    interaction-prompt="auto"
    loading="eager"
    reveal="auto"
    interpolation-decay="200">
  </model-viewer>

  <div class="titlebar">
    <div class="title-main">MASP 模块化气动智能保鲜舱</div>
    <div class="title-sub">空地协同专用</div>
    <div class="title-en">AIR-GROUND SYNERGY POD</div>
  </div>

  <div class="hint">拖拽旋转 · 滚轮缩放 · 右键平移</div>

  <div class="badge">MASP · 3D SHOWROOM</div>

</body>
</html>
